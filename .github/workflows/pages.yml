name: Website (GitHub Pages)

# 只负责 website/ 这个独立站点。
# 与 android-ci.yml、release.yml 完全独立：不构建 APK、不签名、不创建 Release、
# 不读写仓库其它目录，也不共享任何 concurrency group。

on:
  push:
    branches: [dev]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"

  # Release 更新后自动重新生成 metadata 并重新部署。
  #
  # 这里刻意同时挂 workflow_run 和 release 两类事件，原因：
  #   1. release.yml 通过 GITHUB_TOKEN 创建 / 更新 Release，
  #      而 GITHUB_TOKEN 触发的事件不会再启动新的 workflow（GitHub 防递归机制），
  #      所以 release 事件实际上不会为自动发布触发本工作流。
  #   2. 「替换已发布 Release 的附件」不产生任何 release 事件，
  #      只监听 release 事件会漏掉重新上传 APK 的情况。
  # 监听 Android Release 运行结束才是可靠路径，release 事件用于覆盖人工编辑。
  workflow_run:
    workflows: ["Android Release"]
    types: [completed]

  release:
    types: [published, released, edited]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 与 Android 工作流使用不同的 group，避免互相取消。
# 官方 Pages 推荐 cancel-in-progress: false，让部署排队而不是中途取消。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Android Release 失败时不重新部署官网
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 生成 Release metadata
        working-directory: website
        env:
          # 只用于提高 API 速率上限，不会写入 latest-release.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-release-metadata.mjs

      - name: 安装依赖
        working-directory: website
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            # 锁文件与 CI 的 pnpm 版本不一致时不要让整条流水线失败
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: 代码检查
        working-directory: website
        run: pnpm lint

      - name: 构建
        working-directory: website
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

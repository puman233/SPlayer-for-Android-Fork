name: Android Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本 Tag，用于恢复失败发布
        required: true
        type: string
      repair_ref:
        description: 同版本修复的完整提交 SHA（留空按 Tag 发布）
        required: false
        type: string
      replace_release_id:
        description: 明确要替换的 Release ID（修复时必填）
        required: false
        type: string
      authorize_publish:
        description: 明确授权正式发布或指定历史版本修复（仍需 Environment 审核）
        required: true
        default: false
        type: boolean
      reuse_artifact_id:
        description: 保留原 APK 字节的受保护恢复（已审核 Artifact ID；留空正常构建）
        required: false
        type: string
      reuse_artifact_digest:
        description: 已审核 Artifact 的完整 sha256 摘要（恢复时必填）
        required: false
        type: string
      resume_release_id:
        description: 恢复的已存在草稿 ID（恢复时必填，不创建新发行版）
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ inputs.reuse_artifact_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-release
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_REPAIR_REF: ${{ inputs.repair_ref }}
      RELEASE_REPLACE_ID: ${{ inputs.replace_release_id }}
      RELEASE_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_publish && 'true' || 'false' }}
      REQUIRE_ANDROID_UI: ${{ vars.ANDROID_UI_REQUIRED || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.repair_ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - name: 检出当前工作流的发布工具
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: .github
          persist-credentials: false
      - name: 确认 Tag 提交
        run: echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: 验证人工发布授权和提交 CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .release-tools/.github/scripts/development-checks.py release-gate
      - name: 检查已存在的 Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-tools/.github/scripts/android-release.py probe
      - name: 验证中文更新说明与完整性
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .release-tools/.github/scripts/android-release.py notes
      - uses: ./.release-tools/.github/actions/setup-android
        if: steps.existing.outputs.exists == 'false'
      - name: 注入签名并验证版本
        if: steps.existing.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/splayer-release.keystore
        run: |
          python3 .release-tools/.github/scripts/android-release.py signing
          cd android
          ./gradlew --no-daemon :app:verifyReleaseConfiguration
      - name: 构建正式 APK
        if: steps.existing.outputs.exists == 'false'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/splayer-release.keystore
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: 检查签名、版本并收集最终 APK
        if: steps.existing.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/splayer-release.keystore
          EXPECTED_ANDROID_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 .release-tools/.github/scripts/android-release.py collect
      - name: 验证四架构发布契约并记录摘要
        if: steps.existing.outputs.exists == 'false'
        run: python3 -B .release-tools/.github/scripts/release-contract.py local
      - name: 准备固定源码与许可材料并校验全部资产
        if: steps.existing.outputs.exists == 'false' && inputs.replace_release_id == ''
        run: python3 -B .release-tools/.github/scripts/release_assets.py prepare
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          name: release-verified-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          retention-days: 30
      - name: 备份被替换的发行版
        if: steps.existing.outputs.exists == 'false' && inputs.replace_release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-tools/.github/scripts/android-release.py backup
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists == 'false' && inputs.replace_release_id != ''
        with:
          name: previous-release-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-backup/
          if-no-files-found: error
          retention-days: 30
      - name: 创建或恢复 Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-tools/.github/scripts/android-release.py publish
      - name: 校验发布附件完整性
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .release-tools/.github/scripts/release-contract.py remote
      - name: 清理签名材料
        if: always()
        run: rm -f "$RUNNER_TEMP/splayer-release.keystore" "$RUNNER_TEMP/splayer-release-cert.der"
  resume:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_artifact_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REPAIR_REF: ${{ inputs.repair_ref }}
      RELEASE_REPLACE_ID: ${{ inputs.replace_release_id }}
      RELEASE_AUTHORIZED: ${{ inputs.authorize_publish && 'true' || 'false' }}
      REQUIRE_ANDROID_UI: ${{ vars.ANDROID_UI_REQUIRED || 'false' }}
      RELEASE_TOOLS_COMMIT: ${{ github.sha }}
      RELEASE_REUSE_ARTIFACT_ID: ${{ inputs.reuse_artifact_id }}
      RELEASE_REUSE_ARTIFACT_DIGEST: ${{ inputs.reuse_artifact_digest }}
      RELEASE_RESUME_ID: ${{ inputs.resume_release_id }}
      EXPECTED_ANDROID_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            .github
            public/licenses
          persist-credentials: false
      - name: 确认原 Tag 提交及全部原 CI/UI 门禁
        run: |
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          export RELEASE_COMMIT=$(git rev-parse HEAD)
          python3 -B .release-tools/.github/scripts/development-checks.py release-gate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: 安装只读 APK 校验工具
        run: sdkmanager --install 'build-tools;36.0.0'
      - name: 校验来源、原 APK、历史签名及固定源码配套材料
        run: python3 -B .release-tools/.github/scripts/resume-release.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-resume-verified-${{ inputs.tag }}-${{ github.run_id }}
          path: |
            release/
            ${{ runner.temp }}/approved-payload.json
          if-no-files-found: error
          retention-days: 30
      - name: 保持正文及 APK 字节恢复发布
        run: python3 -B .release-tools/.github/scripts/resume-release.py publish
      - name: 验证公开附件、Pre-release 及稳定版保护
        run: python3 -B .release-tools/.github/scripts/resume-release.py verify

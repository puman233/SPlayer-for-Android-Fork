apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// CI 优先使用环境变量，避免密码写入文件或 Gradle 命令行
def signingEnv = [storeFile: 'ANDROID_KEYSTORE_PATH', storePassword: 'ANDROID_KEYSTORE_PASSWORD', keyAlias: 'ANDROID_KEY_ALIAS', keyPassword: 'ANDROID_KEY_PASSWORD']
signingEnv.each { property, variable ->
    if (System.getenv(variable)) {
        keystoreProperties[property] = System.getenv(variable)
    }
}
def hasReleaseSigning = signingEnv.keySet().every { keystoreProperties[it] }

android {
    namespace = "top.imsyy.splayer.android"
    compileSdk = rootProject.ext.compileSdkVersion
    // 使用本机已安装的完整 NDK（AGP 默认的 27.0.12077973 在本机不完整）
    ndkVersion = "28.2.13676358"
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "top.imsyy.splayer.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30020
        versionName "3.0.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // 调试包与正式签名版本并存，避免自动化测试覆盖用户数据
            applicationIdSuffix providers.gradleProperty('verificationSuffix').getOrElse('.debug')
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // 分架构构建：每个 ABI 生成独立 APK，不再生成 universal 合包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-session:1.8.0"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 正式发布读取 Gradle 已解析的变体，签名前检查版本与配置
tasks.register('verifyReleaseConfiguration') {
    doLast {
        def tag = System.getenv('RELEASE_TAG')
        if (!tag || !(tag ==~ /v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/)) {
            throw new GradleException('RELEASE_TAG 必须为 v<versionName>，例如 v3.0.8 或 v3.0.9-rc.1')
        }
        if (!hasReleaseSigning || !android.signingConfigs.release.storeFile.isFile()) {
            throw new GradleException('缺少正式签名：请配置 ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD')
        }
        android.applicationVariants.findAll { it.buildType.name == 'release' }.each { variant ->
            if (variant.versionName != tag.substring(1)) {
                throw new GradleException("版本不一致：Tag=${tag}，${variant.name}.versionName=${variant.versionName}；请先修改 android/app/build.gradle")
            }
            if (!variant.signingConfig || variant.signingConfig.storeFile != android.signingConfigs.release.storeFile || variant.signingConfig.keyAlias != android.signingConfigs.release.keyAlias) {
                throw new GradleException("${variant.name} 未使用正式签名配置")
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
